site_name: Vocnet Documentation
site_description: Open-source vocabulary network management platform and word data hub
site_author: vocnet team
site_url: https://vocnet.apps.tftt.cc

repo_name: eslsoft/vocnet
repo_url: https://github.com/eslsoft/vocnet
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant      # Instant loading
    - navigation.tracking     # Anchor tracking
    - navigation.tabs         # Top navigation tabs
    - navigation.sections     # Sidebar sections
    - navigation.expand       # Expand navigation by default
    - navigation.top          # Back-to-top button
    - search.suggest          # Search suggestions
    - search.highlight        # Search result highlighting
    - search.share            # Share search results
    - content.code.copy       # Copy code button
    - content.action.edit     # Edit this page
    - content.action.view     # View source

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang:
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - admonition              # Admonition blocks
  - pymdownx.details        # Collapsible details blocks
  - pymdownx.superfences    # Enhanced code fences
  - pymdownx.tabbed:        # Tabs
      alternate_style: true
  - pymdownx.highlight:     # Syntax highlighting
      anchor_linenums: true
  - pymdownx.inlinehilite   # Inline code highlighting
  - pymdownx.snippets       # Code snippets
  - tables                  # Tables
  - attr_list               # Attribute lists
  - md_in_html             # Markdown inside HTML
  - pymdownx.emoji:         # Emoji
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:                    # Table of contents
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eslsoft/vocnet
      name: GitHub

  version:
    provider: mike

