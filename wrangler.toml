name = "vocnet"
main = "./server/worker.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
JEV_MODEL = "jev-latest"
# Calls each gateway model gets at once within one review batch; the gateway rate-limits above these.
JEV_CONCURRENCY = "10"
REVIEW_LLM_CONCURRENCY = "5"
DECISIONS_BASE_URL = "https://api.openai.com"
DECISIONS_MODEL = "gpt-6-luna"

[[d1_databases]]
binding = "DB"
database_name = "vocnet"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[queues.producers]]
binding = "REVIEW_QUEUE"
queue = "vocnet-reviews"

[[queues.consumers]]
queue = "vocnet-reviews"
# Each batch's reviews run at once, so the batch size caps concurrent reviewer calls on the model
# gateway: 100 at once tripped its rate limits, and 16 still reviews far more facts an hour than
# producers submit.
max_batch_size = 16
max_retries = 5
dead_letter_queue = "vocnet-reviews-dlq"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# Public feedback: 10 reports per client address per minute.
[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Public reads: 120 GET requests per client address per minute.
[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60
