name = "vocnet"
main = "./server/worker.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
JEV_MODEL = "jev-latest"

[[d1_databases]]
binding = "DB"
database_name = "vocnet"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[queues.producers]]
binding = "REVIEW_QUEUE"
queue = "vocnet-reviews"

[[queues.consumers]]
queue = "vocnet-reviews"
max_batch_size = 25
max_retries = 5
dead_letter_queue = "vocnet-reviews-dlq"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# Public feedback: 10 reports per client address per minute.
[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
