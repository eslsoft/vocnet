syntax = "proto3";

package common.v1;

import "validate/validate.proto";

// ID request message
message IDRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0];
}

// Pagination request parameters
message PaginationRequest {
  int32 page_no = 1; // Number of items to return (default: 20, max: 100)
  int32 page_size = 2; // Number of items to skip (default: 0)
}

// Pagination response metadata
message PaginationResponse {
  int32 total = 1; // Total number of items
  int32 page_no = 2; // Current page number (calculated from offset/limit)
}

// Supported languages
enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_ENGLISH = 1; // en
  LANGUAGE_CHINESE = 2; // zh
  LANGUAGE_SPANISH = 3; // es
  LANGUAGE_FRENCH = 4; // fr
  LANGUAGE_GERMAN = 5; // de
  LANGUAGE_JAPANESE = 6; // ja
  LANGUAGE_KOREAN = 7; // ko
}

// Source types for learned word contexts
enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;

  // Reading
  SOURCE_TYPE_NOVEL = 1; // 小说
  SOURCE_TYPE_EBOOK = 2; // 电子书（非虚构）
  SOURCE_TYPE_ARTICLE = 3; // 文章（新闻、杂志）
  SOURCE_TYPE_BLOG = 4; // 博客
  SOURCE_TYPE_TEXTBOOK = 5; // 教材

  // Audio
  SOURCE_TYPE_AUDIOBOOK = 10; // 有声书
  SOURCE_TYPE_PODCAST = 11; // 播客
  SOURCE_TYPE_SONG = 12; // 歌曲

  // Video
  SOURCE_TYPE_MOVIE = 20; // 电影
  SOURCE_TYPE_TV_SERIES = 21; // 剧集
}
