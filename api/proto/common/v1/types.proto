syntax = "proto3";

package common.v1;

import "validate/validate.proto";

// ID request message
message IDRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0];
}

// Pagination request parameters
message PaginationRequest {
  int32 page_no = 1; // Number of items to return (default: 20, max: 100)
  int32 page_size = 2; // Number of items to skip (default: 0)
}

// Pagination response metadata
message PaginationResponse {
  int32 total = 1; // Total number of items
  int32 page_no = 2; // Current page number (calculated from offset/limit)
}

// Supported languages
enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_ENGLISH = 1; // en
  LANGUAGE_CHINESE = 2; // zh
  LANGUAGE_SPANISH = 3; // es
  LANGUAGE_FRENCH = 4; // fr
  LANGUAGE_GERMAN = 5; // de
  LANGUAGE_JAPANESE = 6; // ja
  LANGUAGE_KOREAN = 7; // ko
}

// Source types for sentences and content
enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_BOOK = 1; // 书籍
  SOURCE_TYPE_WEB = 2; // 网页
  SOURCE_TYPE_AUDIO = 3; // 音频
  SOURCE_TYPE_VIDEO = 4; // 视频
  SOURCE_TYPE_MANUAL = 5; // 手动输入
  SOURCE_TYPE_OTHER = 10; // 其他
}
