syntax = "proto3";

package dict.v1;

option go_package = "github.com/eslsoft/vocnet/pkg/api/dict/v1;dictv1";

// Lexeme is a reusable POS-grouped lexical representation.
message Lexeme {
  string id = 1;
  string pos = 2;
  string primary_gloss = 3;
  repeated LexemeSense senses = 4;
}

// LexemeSense is a reusable lexical sense representation.
message LexemeSense {
  string language = 1;
  string gloss = 2;
  repeated string examples = 3;
}

// SemanticRelation is a reusable semantic relation representation.
message SemanticRelation {
  string relation_type = 1;
  string target_term = 2;
  string target_ref = 3;
  string provider = 4;
  double strength = 5;
}

// Etymology is a reusable etymology representation.
message Etymology {
  string root = 2;
  repeated Derivation derivations = 3;
  repeated string affixes = 5;
  repeated string cognates = 4;
}

message Derivation {
  string surface = 1;
  string language = 2;
  string meaning = 3;
}
