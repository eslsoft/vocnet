syntax = "proto3";

package dict.v1;

import "common/v1/types.proto";
import "dict/v1/phrase.proto";
import "google/protobuf/timestamp.proto";

message Word {
  int64 id = 1; // Unique identifier for this word entry
  common.v1.Language language = 2; // Language of the entry
  string term = 3; // The word text (surface form: "apple", "apples", "ran", etc.)
  FormType term_type = 4; // The type of this word (lemma, plural, past tense, etc.)
  optional string lemma = 5; // The lemma form (only set for non-lemma forms, e.g., "apples" → "apple")

  repeated Phonetic phonetics = 6; // IPAs for this word
  repeated Meaning meanings = 7; // Multiple meanings/senses (different POS or definitions)
  repeated string categories = 8; // Level / topic tags (e.g., "cet4", "cet6", "basic")
  repeated Phrase phrases = 9; // Common phrases/idioms containing this word

  // Related forms: when this is a lemma, lists all its inflected forms
  // Example: "apple" → [{term:"apples", type:PLURAL}, {term:"apple's", type:...}]
  // When this is a non-lemma form, this field is empty
  repeated RelatedForm related_forms = 10;

  repeated string syllables = 11; // Syllabification (e.g. ["a", "bil", "i", "ty"])

  bool irregular = 31; // Whether this is an irregular form (e.g., "went", "children")
  int32 completeness = 32; // Data completeness 0-100, calculated from core fields

  google.protobuf.Timestamp created_at = 100; // Creation timestamp
  google.protobuf.Timestamp updated_at = 101; // Last update timestamp
}

// Reference to a related inflected form
message RelatedForm {
  string term = 1; // Surface form text (e.g., "apples")
  FormType form_type = 2; // Type of this form
  bool irregular = 3; // Whether this is irregular
  repeated string syllables = 4; // Syllabification (e.g. ["ap", "ples"])
}

message Phonetic {
  string ipa = 1; // IPA transcription
  string dialect = 2; // BCP-47 language tag for dialect (e.g. en-US, en-GB)
}

// A specific meaning/sense of the word
message Meaning {
  string lexeme_id = 1; // Wikidata Lexeme ID (e.g. "L123456")
  string pos = 2; // Part of speech, e.g. n., v., adj.
  repeated Definition definitions = 3; // Definition text in different languages
  repeated Sentence examples = 4; // Example sentences
  repeated Relation relations = 5; // Relationships to other words
}

// Definition text in a specific language
message Definition {
  common.v1.Language language = 1;
  string gloss = 2; // The actual definition text
}

// Relationship to another word
message Relation {
  RelationType type = 1;
  string target_word = 2; // The related word (surface form or lemma)
  optional string note = 3; // Optional note about the relationship
}

enum RelationType {
  RELATION_TYPE_UNSPECIFIED = 0;
  RELATION_TYPE_SYNONYM = 1; // Same or similar meaning
  RELATION_TYPE_ANTONYM = 2; // Opposite meaning
  RELATION_TYPE_HYPERNYM = 3; // More general term (e.g., "animal" for "dog")
  RELATION_TYPE_HYPONYM = 4; // More specific term (e.g., "poodle" for "dog")
  RELATION_TYPE_ASSOCIATION = 5; // association (bread->butter)
  RELATION_TYPE_CAUSE_EFFECT = 6; // cause-effect  (smoke->cancer)
  RELATION_TYPE_PART_WHOLE = 7; // part-whole (wheel->car)
  RELATION_TYPE_DERIVATIVE = 8; // derivative word (teacher -> teach)
}

message Sentence {
  string text = 1; // Surface form of the sentence
  common.v1.SourceType source = 2; // How this sentence was added
  string source_ref = 3; // Optional reference (book or article title)
}

enum FormType {
  FORM_TYPE_UNSPECIFIED = 0;
  FORM_TYPE_LEMMA = 1;
  FORM_TYPE_PLURAL = 2;
  FORM_TYPE_PAST = 3;
  FORM_TYPE_PAST_PARTICIPLE = 4;
  FORM_TYPE_PRESENT_PARTICIPLE = 5;
  FORM_TYPE_THIRD_PERSON_SINGULAR = 6;
  FORM_TYPE_COMPARATIVE = 7;
  FORM_TYPE_SUPERLATIVE = 8;
  FORM_TYPE_IMPERATIVE = 9;
  FORM_TYPE_SUBJUNCTIVE = 10;
  FORM_TYPE_GERUND = 11;
  FORM_TYPE_SHORT_FORM = 12;
}
