syntax = "proto3";

package dict.v1;

import "dict/v1/linguistics.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eslsoft/vocnet/pkg/api/dict/v1;dictv1";

enum LemmaLevel {
  LEMMA_LEVEL_UNSPECIFIED = 0;
  LEMMA_LEVEL_A1 = 1;
  LEMMA_LEVEL_A2 = 2;
  LEMMA_LEVEL_B1 = 3;
  LEMMA_LEVEL_B2 = 4;
  LEMMA_LEVEL_C1 = 5;
  LEMMA_LEVEL_C2 = 6;
}

message LemmaData {
  repeated Lexeme lexemes = 1;
  repeated SemanticRelation relations = 2;
}

// Lemma merges base lemma info and latest snapshot payload.
message Lemma {
  int64 id = 1;
  string surface = 2;
  string normalized = 3;
  LemmaLevel level = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;

  optional int64 snapshot_id = 7;
  optional int64 snapshot_job_id = 8;
  string snapshot_term = 9;
  repeated string snapshot_terms = 10;
  string snapshot_language = 11;
  bool snapshot_latest = 12;
  int32 snapshot_version = 13;
  LemmaData snapshot_data = 14;
  double snapshot_q_score = 15;
  double snapshot_q_score_completeness = 16;
  double snapshot_q_score_depth = 17;
  double snapshot_q_score_density = 18;
  double snapshot_q_score_validity = 19;
  google.protobuf.Timestamp snapshot_synthesized_at = 20;
  google.protobuf.Timestamp snapshot_created_at = 21;
  google.protobuf.Timestamp snapshot_updated_at = 22;
}
