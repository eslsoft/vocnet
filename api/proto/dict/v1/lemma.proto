syntax = "proto3";

package dict.v1;

import "dict/v1/linguistics.proto";
import "dict/v1/phrase.proto";
import "dict/v1/word.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eslsoft/vocnet/pkg/api/dict/v1;dictv1";

enum LemmaLevel {
  LEMMA_LEVEL_UNSPECIFIED = 0;
  LEMMA_LEVEL_A1 = 1;
  LEMMA_LEVEL_A2 = 2;
  LEMMA_LEVEL_B1 = 3;
  LEMMA_LEVEL_B2 = 4;
  LEMMA_LEVEL_C1 = 5;
  LEMMA_LEVEL_C2 = 6;
}

message Lemma {
  int64 id = 1;
  string surface = 2;
  string normalized = 3;
  LemmaLevel level = 4;
  repeated LemmaForm forms = 7;
  repeated Lexeme lexemes = 8;
  repeated SemanticRelation relations = 9;
  repeated Phrase phrases = 10;
  Etymology etymology = 11;
  QualityScore qscore = 12;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// LemmaForm is a reusable inflected form representation.
message LemmaForm {
  string surface = 1;
  string form_type = 2;
  bool irregular = 3;
  repeated Phonetic phonetics = 4;
}

// LemmaSnapshot is a snapshot of lemma at a specific time, used for versioning and history tracking.
message LemmaSnapshot {
  int64 id = 1;
  int64 lemma_id = 2;
  Lemma lemma = 4;
  bool latest = 7;
  int32 version = 8;
  int64 job_id = 3;
  google.protobuf.Timestamp synthesized_at = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

// QualityScore represents the quality assessment of a lemma, used for ranking and filtering.
message QualityScore {
  double overall = 1;
  double completeness = 2;
  double depth = 3;
  double density = 4;
  double validity = 5;
}
