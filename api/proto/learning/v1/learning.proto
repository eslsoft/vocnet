syntax = "proto3";

package learning.v1;

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";

// LearnedWord captures a user's personalised vocabulary entry.
// This represents a user's learning record for a word (word-level, not lexeme-level).
message LearnedWord {
  int64 id = 1;
  LearnedWordSpec spec = 3;
  LearnedWordStatus status = 4;
}

// LearnedWordSpec stores user-authored metadata.
message LearnedWordSpec {
  common.v1.Language language = 1; // Language of the term
  string term = 2; // The actual word term (lemma for regular forms, or itself for irregular)

  // User's overall mastery level (1-5), 0 means unspecified:
  //   1 = unknown (completely unfamiliar)
  //   2 = recognized (seen before, can identify)
  //   3 = understood (know the meaning)
  //   4 = proficient (can use actively)
  //   5 = mastered (fluent, automatic)
  // This will be expanded into four skill dimensions (listening, reading, spelling, speaking)
  // based on typical language learning progression where receptive skills develop before productive skills.
  int32 mastery_level = 3;

  repeated string tags = 5;
  repeated string notes = 6;

  repeated LearnedWordContext contexts = 10; // Context sentences where user encountered this word
}

// LearnedWordStatus is maintained by the system to reflect learning progress.
message LearnedWordStatus {
  MasteryBreakdown mastery = 1;
  ReviewTiming review_timing = 2;
  repeated string matched_terms = 3; // All query terms that matched this word (for client-side highlighting)
  repeated string matched_wordbooks = 4; // Wordbooks that contain this word

  // MasteryLevel encodes both coarse stage (unknown/learning/known)
  // and whether the word is known passively or actively.
  MasteryLevel level = 5;

  string created_by = 10; // username of the creator
  int64 queried_count = 11; // number of times user queried this word

  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

// Mastery breakdown for different skills
message MasteryBreakdown {
  int32 listening = 1; // Listening mastery (0-5)
  int32 reading = 2; // Reading mastery (0-5)
  int32 spelling = 3; // Spelling mastery (0-5)
  int32 speaking = 4; // Pronunciation mastery (0-5)
  int32 overall = 5; // Overall mastery score (0-500, stored as *100), derived from receptive/productive scores
}

// MasteryLevel represents the user's current mastery state for a word.
enum MasteryLevel {
  MASTERY_LEVEL_UNSPECIFIED = 0; // Not set (system default)
  MASTERY_LEVEL_UNKNOWN = 1;     // Completely unfamiliar
  MASTERY_LEVEL_RECOGNIZED = 2;  // Seen before, can identify
  MASTERY_LEVEL_UNDERSTOOD = 3;  // Know the meaning
  MASTERY_LEVEL_PROFICIENT = 4;  // Can use actively
  MASTERY_LEVEL_MASTERED = 5;    // Fluent, automatic
}

// Review timing information
message ReviewTiming {
  google.protobuf.Timestamp last_review_at = 1;
  google.protobuf.Timestamp next_review_at = 2;
  int32 interval_days = 3; // Current review interval
  int32 fail_count = 4; // Consecutive failure count
}

// LearnedWordContext stores a sentence/context where user encountered the word
message LearnedWordContext {
  string sentence = 1; // The sentence containing the word
  common.v1.SourceType source = 2; // How this context was added (article, book, manual, etc.)
  string source_ref = 3; // Optional reference (article title, book name, URL, etc.)
  google.protobuf.Timestamp collected_at = 4; // When this context was collected
}
