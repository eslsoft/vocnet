syntax = "proto3";

package learning.v1;

import "common/v1/types.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// LearnedLexeme captures a user's personalised link to a lexeme.
message LearnedLexeme {
  int64 id = 1;
  int64 lexeme_id = 2;
  LearnedLexemeSpec spec = 3;
  LearnedLexemeStatus status = 4;
}

// LearnedLexemeSpec stores user-authored metadata.
message LearnedLexemeSpec {
  string display_term = 1;
  common.v1.Language language = 2;
  repeated string tags = 3;
  string note = 4;
  repeated LearnedLexemeRelation relations = 5;
}

// LearnedLexemeStatus is maintained by the system to reflect learning progress.
message LearnedLexemeStatus {
  MasteryBreakdown mastery = 1;
  ReviewTiming review_timing = 2;
  map<string, FormMastery> form_status = 3;
  int64 query_count = 4;

  string created_by = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

// Mastery breakdown for different skills
message MasteryBreakdown {
  int32 listen = 1; // Listening mastery (0-5)
  int32 read = 2; // Reading mastery (0-5)
  int32 spell = 3; // Spelling mastery (0-5)
  int32 pronounce = 4; // Pronunciation mastery (0-5)
  int32 overall = 6; // Overall mastery score (0-500, stored as *100)
}

// Review timing information
message ReviewTiming {
  google.protobuf.Timestamp last_review_at = 1;
  google.protobuf.Timestamp next_review_at = 2;
  int32 interval_days = 3; // Current review interval
  int32 fail_count = 4; // Consecutive failure count
}

// Mastery signals for a specific surface form of a lexeme.
message FormMastery {
  string form_id = 1;
  int32 strength = 2;
  int32 exposure = 3;
  google.protobuf.Struct metadata = 4;
}

// Lexeme-to-lexeme relationship for building vocabulary networks
message LearnedLexemeRelation {
  string word = 1;
  common.v1.RelationType relation_type = 2; // Type of relationship
  string note = 3; // User's note about this relation

  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

