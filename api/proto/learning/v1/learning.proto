syntax = "proto3";

package learning.v1;

import "common/v1/types.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// LearnedWord captures a user's personalised vocabulary entry.
// This represents a user's learning record for a word (word-level, not lexeme-level).
message LearnedWord {
  int64 id = 1;
  int64 word_id = 2;  // Reference to words.id
  LearnedWordSpec spec = 3;
  LearnedWordStatus status = 4;
}

// LearnedWordSpec stores user-authored metadata.
message LearnedWordSpec {
  string display_term = 1;  // The surface form user encountered (e.g. "ran" when learning "run")
  common.v1.Language language = 2;
  repeated string tags = 3;
  string note = 4;
  repeated LearnedWordRelation relations = 5;
  repeated LearnedWordContext contexts = 6;  // Context sentences where user encountered this word

  // FUTURE: lexeme_overrides for advanced users who need per-lexeme mastery tracking
  // map<string, LexemeOverride> lexeme_overrides = 10;
  // This will allow tracking mastery for specific word senses (e.g. "bank" as "银行" vs "河岸")
  // when the default word-level mastery is insufficient.
  // Format: {"L123456": {mastery: {...}, note: "..."}}
}

// LearnedWordStatus is maintained by the system to reflect learning progress.
message LearnedWordStatus {
  MasteryBreakdown mastery = 1;
  ReviewTiming review_timing = 2;
  int64 query_count = 3;

  string created_by = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

// Mastery breakdown for different skills
message MasteryBreakdown {
  int32 listen = 1; // Listening mastery (0-5)
  int32 read = 2; // Reading mastery (0-5)
  int32 spell = 3; // Spelling mastery (0-5)
  int32 pronounce = 4; // Pronunciation mastery (0-5)
  int32 overall = 6; // Overall mastery score (0-500, stored as *100)
}

// Review timing information
message ReviewTiming {
  google.protobuf.Timestamp last_review_at = 1;
  google.protobuf.Timestamp next_review_at = 2;
  int32 interval_days = 3; // Current review interval
  int32 fail_count = 4; // Consecutive failure count
}

// Word-to-word relationship for building vocabulary networks
message LearnedWordRelation {
  string word = 1;
  common.v1.RelationType relation_type = 2; // Type of relationship
  string note = 3; // User's note about this relation

  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

// LearnedWordContext stores a sentence/context where user encountered the word
message LearnedWordContext {
  string sentence = 1; // The sentence containing the word
  common.v1.SourceType source = 2; // How this context was added (article, book, manual, etc.)
  string source_ref = 3; // Optional reference (article title, book name, URL, etc.)
  google.protobuf.Timestamp collected_at = 4; // When this context was collected
}

