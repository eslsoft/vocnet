syntax = "proto3";

package learning.v1;

import "common/v1/types.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "learning/v1/flashcard.proto";
import "learning/v1/learning.proto";
import "learning/v1/review_plan.proto";

message CreateReviewPlanRequest {
  string name = 1;
  string description = 2;
  repeated int64 wordbook_ids = 3;
}

message UpdateReviewPlanRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  repeated int64 wordbook_ids = 4;
}

message ListReviewPlansRequest {
  common.v1.PaginationRequest pagination = 1;
  string filter = 2;
  string order_by = 3;
}

message ListReviewPlansResponse {
  common.v1.PaginationResponse pagination = 1;
  repeated ReviewPlan plans = 2;
}

message GetFlashCardsRequest {
  int32 review_plan_id = 1;
  int32 limit = 2;
}

message FlashCardSet {
  common.v1.PaginationResponse pagination = 1;
  repeated FlashCard flash_cards = 2;
  FlashCardStats stats = 3;
}

// FlashCard statistics for current session
message FlashCardStats {
  // Fixed totals for progress calculation
  int32 today_due_total = 1;      // Total words due at start of day (fixed)
  int32 today_new_total = 2;      // Daily new words quota (fixed)

  // Remaining tasks (dynamic)
  int32 today_due_remaining = 3;  // Remaining words due for review
  int32 today_new_remaining = 4;  // Remaining new words quota

  // Progress
  int32 today_reviewed_count = 5; // Number of cards already reviewed today

  // Other
  int32 estimated_minutes = 6;    // Estimated time to complete current batch (minutes)
}

// ============================================================================
// Submit Answers - Batch submission of answer records
// ============================================================================

// Request to submit answer records
message SubmitAnswerRequest {
  int32 review_plan_id = 1;
  repeated AnswerResult results = 2;
}

// Single answer result for one flashcard
message AnswerResult {
  int64 lword_id = 1; // Stable linkage to LearnedWord
  CardType card_type = 2; // Type of the card answered

  // Result details
  bool correct = 3; // Whether the answer was strictly correct
  float accuracy = 4; // Accuracy score (0.0 - 1.0), useful for partial matches

  int32 time_spent_seconds = 5; // Time spent answering (seconds)
  google.protobuf.Timestamp answered_at = 6; // Timestamp when the answer was submitted
}

service ReviewPlanService {
  rpc CreateReviewPlan(CreateReviewPlanRequest) returns (ReviewPlan) {}
  rpc UpdateReviewPlan(UpdateReviewPlanRequest) returns (ReviewPlan) {}
  rpc GetReviewPlan(common.v1.IDRequest) returns (ReviewPlan) {}
  rpc ListReviewPlans(ListReviewPlansRequest) returns (ListReviewPlansResponse) {}
  rpc DeleteReviewPlan(common.v1.IDRequest) returns (google.protobuf.Empty) {}

  rpc GetFlashCards(GetFlashCardsRequest) returns (FlashCardSet) {}
  rpc SubmitAnswer(SubmitAnswerRequest) returns (google.protobuf.Empty) {}
}
