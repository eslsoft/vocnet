syntax = "proto3";

package learning.v1;

import "dict/v1/word.proto";

// ============================================================================
// FlashCard - 统一的卡片结构
// ============================================================================
//
// FlashCard 是一个通用的复习卡片数据结构，支持6种题型。
// 客户端根据 `type` 字段选择对应的渲染器和验证逻辑。
//
// 字段使用规范 (按 CardType):
// ┌─────────────────────┬─────────┬──────────┬─────────┬─────────┐
// │ CardType            │ prompt  │ question │ options │ answer  │
// ├─────────────────────┼─────────┼──────────┼─────────┼─────────┤
// │ CHOICE              │ 必需    │ 必需     │ 必需    │ 必需    │
// │ SELECT_WORDS        │ 必需    │ 必需     │ 必需    │ 必需    │
// │ SPELLING            │ 必需    │ 必需     │ 可选    │ 必需    │
// │ ARRANGE             │ 必需    │ 必需     │ 必需    │ 必需    │
// │ MATCHING            │ 必需    │ 必需     │ 必需    │ 必需    │
// │ SPEAKING            │ 必需    │ 必需     │ 不使用  │ 必需    │
// └─────────────────────┴─────────┴──────────┴─────────┴─────────┘
//
// 数据约束:
// - CHOICE: options 至少2项, answer.correct_values 长度≥1
//           客户端根据 correct_values 长度判断渲染单选(=1)或多选(>1)
// - SELECT_WORDS: question.text 用 ___ 标识空位, options 提供候选词 (text字段)
//                 支持单空和多空, answer.correct_values 格式为 "blankId:optionId"
// - SPELLING: question.text 不显示给用户 (仅用于TTS), question.auto_play=true
//             options 可选 (用于提示), answer.correct_values 为拼写文本
// - ARRANGE: options 是打乱顺序的单词列表 (可能包含干扰词)
//            answer.correct_values 是正确的单词ID顺序
// - MATCHING: options 必须有 group 字段 ("left"/"right")
//             answer.correct_values 格式为 "leftId:rightId"
// - SPEAKING: question.auto_play 通常为 true, options 为空数组
//             answer.correct_values 为目标发音文本
//
// 示例见各 CardType 枚举值注释。
message FlashCard {
  string id = 1; // 卡片唯一标识
  map<string, string> annotations = 2; // 卡片注解
  CardType type = 3; // 卡片类型 (决定UI渲染和验证逻辑)
  int32 difficulty = 4; // 难度等级 (1-5)
  string prompt = 5; // 提示文本/指令 (如 "选择正确的中文释义", "跟读单词")
  CardQuestion question = 6; // 具体问题内容
  CardAnswer answer = 7; // 标准答案和验证规则
  repeated CardItem options = 8; // 可交互项 (选项/填空位/排序项/配对项)
  int64 lword_id = 9; // 关联的 LearnedWord ID (用于结果回传)
}

// ============================================================================
// CardType - 题型 (决定UI渲染和验证逻辑)
// ============================================================================
enum CardType {
  CARD_TYPE_UNSPECIFIED = 0;

  // 选择题 - 从多个选项中选择正确答案 (单选/多选)
  //
  // 示例1: 单选 (correct_values 长度=1)
  // {
  //   "id": "card_001",
  //   "type": "CARD_TYPE_CHOICE",
  //   "difficulty": 2,
  //   "prompt": "选择正确的中文释义",
  //   "question": {
  //     "text": "apple",
  //     "auto_play": true,
  //     "phonetics": [{"accent": "US", "text": "/ˈæpl/"}]
  //   },
  //   "options": [
  //     {"id": "A", "text": "苹果"},
  //     {"id": "B", "text": "香蕉"},
  //     {"id": "C", "text": "橙子"}
  //   ],
  //   "answer": {
  //     "correct_values": ["A"]
  //   }
  // }
  //
  // 示例2: 多选 (correct_values 长度>1)
  // {
  //   "id": "card_002",
  //   "type": "CARD_TYPE_CHOICE",
  //   "difficulty": 3,
  //   "prompt": "选择所有表示水果的单词",
  //   "question": {
  //     "text": "Which are fruits?"
  //   },
  //   "options": [
  //     {"id": "A", "text": "apple"},
  //     {"id": "B", "text": "car"},
  //     {"id": "C", "text": "banana"},
  //     {"id": "D", "text": "computer"}
  //   ],
  //   "answer": {
  //     "correct_values": ["A", "C"]
  //   }
  // }
  //
  // UI渲染: 根据 correct_values.length 自动判断
  //         length=1 → 选择一个后即可提交
  //         length>1 → 至少选择 correct_values.length 个后可以提交
  // 验证逻辑: set(userAnswers) == set(answer.correct_values)
  CARD_TYPE_CHOICE = 1;

  // 选词填空题 - 从候选词中选择填入空位 (支持单空和多空)
  //
  // 示例1: 单空选词填空
  // {
  //   "id": "card_003",
  //   "type": "CARD_TYPE_SELECT_WORDS",
  //   "difficulty": 2,
  //   "prompt": "选择正确的单词填空",
  //   "question": {
  //     "text": "I eat an ___ every day.",
  //     "image_url": "https://example.com/apple.jpg"
  //   },
  //   "options": [
  //     {"id": "opt1", "text": "apple"},
  //     {"id": "opt2", "text": "car"},
  //     {"id": "opt3", "text": "book"}
  //   ],
  //   "answer": {
  //     "correct_values": ["blank1:opt1"]
  //   }
  // }
  //
  // 示例2: 多空选词填空
  // {
  //   "id": "card_004",
  //   "type": "CARD_TYPE_SELECT_WORDS",
  //   "difficulty": 3,
  //   "prompt": "选择正确的单词填空",
  //   "question": {
  //     "text": "I ___ an apple. Apples ___ healthy."
  //   },
  //   "options": [
  //     {"id": "opt1", "text": "eat"},
  //     {"id": "opt2", "text": "drink"},
  //     {"id": "opt3", "text": "are"},
  //     {"id": "opt4", "text": "is"}
  //   ],
  //   "answer": {
  //     "correct_values": ["blank1:opt1", "blank2:opt3"]
  //   }
  // }
  //
  // UI渲染: 拖拽单词到空位 (drag-and-drop)
  // 验证逻辑: correct_values 格式为 "blankId:optionId"
  //           客户端按 ___ 出现顺序匹配空位: 第1个___ = blank1, 第2个___ = blank2
  // 注意: question.text 中用 ___ 标识空位 (按出现顺序)
  //       options 提供所有候选词 (可能包含干扰词)
  CARD_TYPE_SELECT_WORDS = 2;

  // 听写拼写题 - 听音频后手动拼写 (单词或句子)
  //
  // 示例1: 单词拼写
  // {
  //   "id": "card_005",
  //   "type": "CARD_TYPE_SPELLING",
  //   "difficulty": 2,
  //   "prompt": "听音频，拼写出你听到的单词",
  //   "question": {
  //     "text": "apple",
  //     "auto_play": true,
  //     "phonetics": [{"accent": "US", "text": "/ˈæpl/"}]
  //   },
  //   "options": [
  //     {"id": "hint1", "hint": "5 letters"}
  //   ],
  //   "answer": {
  //     "correct_values": ["apple"],
  //     "config": {
  //       "ignore_case": true
  //     }
  //   }
  // }
  //
  // 示例2: 句子拼写
  // {
  //   "id": "card_006",
  //   "type": "CARD_TYPE_SPELLING",
  //   "difficulty": 4,
  //   "prompt": "听音频，拼写出你听到的句子",
  //   "question": {
  //     "text": "I eat an apple every day",
  //     "auto_play": true
  //   },
  //   "options": [],
  //   "answer": {
  //     "correct_values": ["I eat an apple every day"],
  //     "config": {
  //       "ignore_case": true,
  //       "ignore_punctuation": true
  //     }
  //   }
  // }
  //
  // UI渲染: 音频播放按钮 + 文本输入框 (audio player + text input)
  // 验证逻辑: normalize(userInput) == normalize(answer.correct_values[0])
  // 注意: question.text 不显示给用户, 仅用于生成TTS音频
  //       question.auto_play 通常为 true (自动播放音频)
  //       options 可选, 用于提供提示 (如字母数、单词数)
  CARD_TYPE_SPELLING = 3;

  // 排序组句题 - 将打乱的单词重组成正确的句子 (支持干扰词)
  //
  // 示例1: 句子重组 (所有词都用)
  // {
  //   "id": "card_007",
  //   "type": "CARD_TYPE_ARRANGE",
  //   "difficulty": 3,
  //   "prompt": "将下列单词组成一个正确的句子",
  //   "question": {
  //     "text": "重组句子"
  //   },
  //   "options": [
  //     {"id": "1", "text": "apple"},
  //     {"id": "2", "text": "an"},
  //     {"id": "3", "text": "eat"},
  //     {"id": "4", "text": "I"},
  //     {"id": "5", "text": "day"},
  //     {"id": "6", "text": "every"}
  //   ],
  //   "answer": {
  //     "correct_values": ["4", "3", "2", "1", "6", "5"],
  //     "config": {
  //       "strict_order": true
  //     }
  //   }
  // }
  //
  // 示例2: 听音选词组句 (带干扰词)
  // {
  //   "id": "card_008",
  //   "type": "CARD_TYPE_ARRANGE",
  //   "difficulty": 4,
  //   "prompt": "听音频，选择正确的单词并组成句子",
  //   "question": {
  //     "text": "I eat an apple",
  //     "auto_play": true
  //   },
  //   "options": [
  //     {"id": "1", "text": "I"},
  //     {"id": "2", "text": "eat"},
  //     {"id": "3", "text": "an"},
  //     {"id": "4", "text": "apple"},
  //     {"id": "5", "text": "banana"},      // 干扰词
  //     {"id": "6", "text": "drink"}        // 干扰词
  //   ],
  //   "answer": {
  //     "correct_values": ["1", "2", "3", "4"],
  //     "config": {
  //       "strict_order": true
  //     }
  //   }
  // }
  //
  // UI渲染: 可拖拽的单词卡片 (draggable word cards)
  // 验证逻辑:
  //   - 所有词都用: userOrder == answer.correct_values
  //   - 有干扰词: userOrder == answer.correct_values (未选择的词忽略)
  // 注意: options 是打乱顺序的单词列表 (可能包含干扰词)
  //       answer.correct_values 是正确的单词ID顺序
  //       question.auto_play=true 表示自动播放音频 (听音选词组句场景)
  CARD_TYPE_ARRANGE = 4;

  // 配对匹配题 - 将左侧项与右侧项配对
  //
  // 示例: 将单词与其释义匹配
  // {
  //   "id": "card_009",
  //   "type": "CARD_TYPE_MATCHING",
  //   "difficulty": 4,
  //   "prompt": "将单词与释义匹配",
  //   "question": {
  //     "text": "Match words with their meanings"
  //   },
  //   "options": [
  //     {"id": "w1", "text": "apple", "group": "left"},
  //     {"id": "w2", "text": "car", "group": "left"},
  //     {"id": "m1", "text": "苹果", "group": "right"},
  //     {"id": "m2", "text": "汽车", "group": "right"}
  //   ],
  //   "answer": {
  //     "correct_values": ["w1:m1", "w2:m2"]
  //   }
  // }
  //
  // UI渲染: 两列布局, 连续点击两个进行配对 (two-column matching)
  // 验证逻辑: set(userPairs) == set(answer.correct_values)
  // 注意: options 必须有 group 字段 ("left" 或 "right")
  //       answer.correct_values 格式为 "leftId:rightId"
  CARD_TYPE_MATCHING = 5;

  // 语音跟读题 - 朗读单词或句子, 通过语音识别验证
  //
  // 示例: 跟读单词
  // {
  //   "id": "card_010",
  //   "type": "CARD_TYPE_SPEAKING",
  //   "difficulty": 3,
  //   "prompt": "跟读单词",
  //   "question": {
  //     "text": "apple",
  //     "auto_play": true,
  //     "phonetics": [{"accent": "US", "text": "/ˈæpl/"}]
  //   },
  //   "options": [],
  //   "answer": {
  //     "correct_values": ["apple"],
  //     "config": {
  //       "ignore_case": true,
  //       "min_similarity": 0.85
  //     }
  //   }
  // }
  //
  // UI渲染: 录音按钮 + 波形图 (audio recorder + waveform)
  // 验证逻辑: speech_to_text(userAudio).similarity(answer.correct_values[0]) >= min_similarity
  // 注意: options 通常为空数组
  //       question.auto_play 通常为 true (自动播放目标音频)
  CARD_TYPE_SPEAKING = 6;
}

// ============================================================================
// CardQuestion - 问题内容
// ============================================================================
message CardQuestion {
  // 问题文本，可以是:
  // - 单词 (如 "apple")
  // - 句子 (如 "I eat an ___ every day")
  // - 问题描述 (如 "Which are fruits?")
  string text = 1;

  // 是否自动播放音频 (通过 TTS API)
  // - 单选/多选题: 通常为 false (用户手动点击播放)
  // - 语音题: 通常为 true (自动播放示范音频)
  bool auto_play = 2;

  // 音标列表 (当 text 是单词时使用)
  // 示例: [{"accent": "US", "text": "/ˈæpl/"}, {"accent": "UK", "text": "/ˈæpəl/"}]
  repeated dict.v1.Phonetic phonetics = 3;

  // 问题配图URL (可选)
  // 用途: 帮助理解上下文, 如填空题配图、选择题场景图
  string image_url = 4;
}

// ============================================================================
// CardAnswer - 答案和验证规则
// ============================================================================
message CardAnswer {
  // 正确答案值 (格式因题型而异):
  //
  // - 选择题 (CHOICE):
  //   选项ID列表, 长度≥1
  //   示例: ["A"] (单选) 或 ["A", "C"] (多选)
  //
  // - 选词填空 (SELECT_WORDS):
  //   "blankId:optionId" 格式列表
  //   示例: ["blank1:opt1", "blank2:opt3"]
  //
  // - 拼写题 (SPELLING):
  //   可接受的拼写文本列表 (支持多个近义词)
  //   示例: ["apple", "apples"]
  //
  // - 排序题 (ARRANGE):
  //   排序后的选项ID列表
  //   示例: ["2", "1", "3"] 表示正确顺序是 id=2, id=1, id=3
  //
  // - 匹配题 (MATCHING):
  //   "leftId:rightId" 格式的配对列表
  //   示例: ["w1:m1", "w2:m2"]
  //
  // - 语音题 (SPEAKING):
  //   目标发音的文本
  //   示例: ["apple"]
  repeated string correct_values = 1;

  // 验证配置 (可选)
  AnswerConfig config = 2;
}

// ============================================================================
// AnswerConfig - 答案验证配置
// ============================================================================
message AnswerConfig {
  // 忽略大小写 (填空题、语音题常用)
  // true: "Apple" == "apple"
  bool ignore_case = 1;

  // 忽略重音符号 (填空题常用)
  // true: "café" == "cafe"
  bool ignore_accents = 2;

  // 忽略标点符号 (听写题常用)
  // true: "Hello, world!" == "Hello world"
  bool ignore_punctuation = 3;

  // 严格顺序模式 (ARRANGE 排序题专用)
  // true: 必须完全匹配顺序
  // false: 只要部分顺序正确即可 (宽松模式)
  bool strict_order = 4;

  // 最小相似度阈值 (SPEAKING 语音题专用, 范围 0.0-1.0)
  // 通过语音识别转文本后, 计算与 correct_values 的相似度
  // 示例: 0.85 表示相似度≥85%即判定为正确
  float min_similarity = 5;
}

// ============================================================================
// CardItem - 可交互项 (选项/填空位/排序项/配对项)
// ============================================================================
message CardItem {
  // 项目唯一标识
  // - 选择题: 选项ID (如 "A", "B", "C")
  // - 排序题: 项目ID (如 "1", "2", "3")
  // - 匹配题: 项目ID (如 "w1", "m1")
  // - 填空题: 填空位ID (如 "blank1", "blank2")
  string id = 1;

  // 显示文本
  // - 选择题: 选项内容 (如 "苹果")
  // - 排序题: 待排序项 (如 "dog")
  // - 匹配题: 左侧单词或右侧释义 (如 "apple" / "苹果")
  // - 填空题: 通常为空 (用户输入)
  string text = 2;

  // 分组标识 (匹配题专用)
  // 值: "left" 或 "right"
  // 示例: {"id": "w1", "text": "apple", "group": "left"}
  string group = 3;

  // 填空提示 (填空题专用)
  // 示例: "a red fruit" (提示用户答案是一种红色水果)
  string hint = 4;

  // 是否点击时自动播放音频 (选择题可选)
  // 用途: 听力选择题, 点击选项播放对应音频
  // 示例: true 表示点击该选项时通过 TTS 播放 text 内容
  bool auto_play = 5;
}
