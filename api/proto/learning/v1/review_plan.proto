syntax = "proto3";

package learning.v1;

import "google/protobuf/timestamp.proto";
import "wordbook/v1/wordbook.proto";

// ReviewPlan represents a user's plan for reviewing words.
message ReviewPlan {
  int64 id = 1;
  string name = 2;
  string description = 3;

  ReviewPlanConfig config = 6;

  ReviewPlanStatus status = 10;

  string created_by = 20; // username of the creator
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

message ReviewPlanConfig {
  int32 daily_new_limit = 1; // Maximum new words to learn per day
}

message ReviewPlanStatus {
  // Inventory statistics (Overall learning progress)
  InventoryStats inventory = 1;

  // Daily task queue (Today's todo list)
  DailyTaskStats daily_task = 2;

  repeated wordbook.v1.Wordbook wordbooks = 10;
}

// InventoryStats tracks word counts by mastery level.
// Thresholds are based on overall score (0-500 scale):
//   - MASTERED: overall >= 418 (Level 5)
//   - LEARNING: overall 126-417 (Level 2-4)
//   - UNKNOWN: overall < 126 (Level 0-1)
message InventoryStats {
  int32 total_words = 1; // Total words in the plan
  int32 unknown_words = 2; // Words with overall < 126 (Level 0-1)
  int32 learning_words = 3; // Words with overall 126-417 (Level 2-4)
  int32 mastered_words = 4; // Words with overall >= 418 (Level 5)
}

message DailyTaskStats {
  int32 review_due = 1; // Words due for review today (Backlog + Due Today)
  int32 new_words_remaining = 2; // Remaining new words quota for today
  int32 new_words_completed = 3; // New words learned for this plan today
  int32 cards_reviewed_today = 4; // Total cards reviewed for this plan today
}
