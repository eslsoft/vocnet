syntax = "proto3";

package learning.v1;

import "google/protobuf/timestamp.proto";

// ============================================================================
// StatsService - 学习统计服务
// ============================================================================
//
// 提供用户学习数据的统计聚合，用于首页仪表盘、进度分析和热力图展示。
// 核心关注点：
// 1. 实时性：DashboardStats 需要快速响应
// 2. 趋势性：ActivityCalendar 反映长期坚持情况
// 3. 分布性：MasteryDistribution 反映词汇质量
//
service StatsService {
  // 获取首页仪表盘核心数据
  // 包含：今日任务、总词汇量、打卡天数等
  rpc GetDashboardStats(GetDashboardStatsRequest) returns (DashboardStats) {}

  // 获取掌握度分布数据
  // 用于展示用户词汇在不同掌握等级(0-5)的分布情况
  rpc GetMasteryDistribution(GetMasteryDistributionRequest) returns (MasteryDistribution) {}

  // 获取学习活动热力图数据
  // 用于展示类似 GitHub 的贡献度热力图
  rpc GetActivityCalendar(GetActivityCalendarRequest) returns (ActivityCalendar) {}
}

// ============================================================================
// Request/Response Messages
// ============================================================================

message GetDashboardStatsRequest {}

message DashboardStats {
  // --- 全局进度 ---
  int32 total_words = 1; // 总收藏词汇量
  int32 mastered_words = 2; // 已掌握词汇量 (Level >= 4)

  // --- 今日概览 ---
  int32 today_reviewed_count = 3; // 今日已复习卡片数 (次数)
  int32 today_due_words = 4; // 今日剩余待复习单词数 (全局，去重后)
  int32 today_new_words = 5; // 今日新学单词数
  int32 today_time_spent = 6; // 今日学习时长 (秒)

  // --- 激励数据 ---
  int32 streak_days = 7; // 当前连续打卡天数
}

message GetMasteryDistributionRequest {}

message MasteryDistribution {
  // key: mastery level (0:Unknown, 1:Seen, 2:Recognize, 3:Usable, 4:Proficient, 5:Mastered)
  // value: word count
  map<int32, int32> distribution = 1;

  // 统计生成时间
  google.protobuf.Timestamp generated_at = 2;
}

message GetActivityCalendarRequest {
  // 查询范围开始时间 (默认最近一年)
  google.protobuf.Timestamp start_time = 1;
  // 查询范围结束时间 (默认当前)
  google.protobuf.Timestamp end_time = 2;

  // 时区偏移量 (分钟)，用于正确计算"天"的边界
  // 例如: UTC+8 -> 480
  int32 timezone_offset = 3;
}

message ActivityCalendar {
  repeated DailyActivity activities = 1;
}

message DailyActivity {
  string date = 1; // 日期字符串 "YYYY-MM-DD"
  int32 count = 2; // 活动量 (复习次数 + 新学次数 + 收藏次数)
  int32 level = 3; // 活动等级 (0-4)，用于前端渲染不同深浅的颜色
}
