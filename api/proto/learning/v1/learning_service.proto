syntax = "proto3";

package learning.v1;

import "common/v1/types.proto";
import "google/protobuf/empty.proto";
import "learning/v1/learning.proto";
import "validate/validate.proto";

// CollectWord request - main API for adding words to the user's vocabulary.
message CollectWordRequest {
  LearnedWordSpec spec = 1 [(validate.rules).message.required = true];
}

// UpdateMasteryRequest updates mastery using simple user perception (0-5).
// The system will automatically convert this to four-dimensional breakdown
// using the same logic as CollectWord (InitializeFromUserMasteryLevel).
message UpdateMasteryRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0]; // LearnedWord ID

  // User's overall mastery perception (0-5):
  //   0 = unknown/not started
  //   1 = seen before (vague recognition)
  //   2 = recognize in context (can understand when seen/heard)
  //   3 = know meaning well (solid comprehension, limited production)
  //   4 = can use passively (excellent comprehension, emerging active use)
  //   5 = fully mastered (fluent in all skills)
  // This will be expanded into four skill dimensions automatically.
  int32 mastery_level = 2 [(validate.rules).int32 = {gte: 0, lte: 5}];

  repeated string tags = 3;
  repeated string notes = 4;
}

// ListLearnedWordsRequest request with comprehensive filtering.
message ListLearnedWordsRequest {
  common.v1.PaginationRequest pagination = 1;
  string filter = 2;
  string order_by = 3;
}

message ListLearnedWordsResponse {
  common.v1.PaginationResponse pagination = 1;
  repeated LearnedWord words = 2;
}

// User vocabulary management service for personal word learning.
service LearningService {
  rpc CollectWord(CollectWordRequest) returns (LearnedWord) {}
  rpc UncollectWord(common.v1.IDRequest) returns (google.protobuf.Empty) {}
  rpc GetLearnedWord(common.v1.IDRequest) returns (LearnedWord) {}
  rpc ListLearnedWords(ListLearnedWordsRequest) returns (ListLearnedWordsResponse) {}
  rpc UpdateMastery(UpdateMasteryRequest) returns (LearnedWord) {}
}
