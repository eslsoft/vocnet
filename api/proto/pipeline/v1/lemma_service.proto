syntax = "proto3";

package pipeline.v1;

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";
import "pipeline/v1/linguistics.proto";

option go_package = "github.com/eslsoft/vocnet/pkg/api/pipeline/v1;pipelinev1";

// LemmaService provides lemma list APIs.
service LemmaService {
  // ListLemmas lists lemmas for selecting a lemma and then querying its jobs.
  rpc ListLemmas(ListLemmasRequest) returns (ListLemmasResponse);
}

message ListLemmasRequest {
  common.v1.PaginationRequest pagination = 1;
  // Optional fuzzy search on lemma surface / normalized form.
  string keyword = 2;
}

enum LemmaLevel {
  LEMMA_LEVEL_UNSPECIFIED = 0;
  LEMMA_LEVEL_A1 = 1;
  LEMMA_LEVEL_A2 = 2;
  LEMMA_LEVEL_B1 = 3;
  LEMMA_LEVEL_B2 = 4;
  LEMMA_LEVEL_C1 = 5;
  LEMMA_LEVEL_C2 = 6;
}

message LemmaItem {
  int64 id = 1;
  string surface = 2;
  string normalized = 3;
  LemmaLevel level = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Latest materialized snapshot for this lemma. Nil when not synthesized yet.
  LemmaSnapshot snapshot = 7;
}

message LemmaSnapshotData {
  repeated Lexeme lexemes = 1;
  repeated SemanticRelation relations = 2;
}

message LemmaSnapshot {
  int64 id = 1;
  int64 lemma_id = 2;
  optional int64 job_id = 3;
  string term = 4;
  repeated string terms = 5;
  string language = 6;
  bool latest = 7;
  int32 version = 8;
  LemmaSnapshotData data = 9;
  double q_score = 10;
  double q_score_completeness = 11;
  double q_score_depth = 12;
  double q_score_density = 13;
  double q_score_validity = 14;
  google.protobuf.Timestamp synthesized_at = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message ListLemmasResponse {
  repeated LemmaItem lemmas = 1;
  common.v1.PaginationResponse pagination = 2;
}
