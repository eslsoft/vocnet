syntax = "proto3";

package pipeline.v1;

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";
import "pipeline/v1/pipeline.proto";

option go_package = "github.com/eslsoft/vocnet/pkg/api/pipeline/v1;pipelinev1";

// LemmaService provides lemma list APIs.
service LemmaService {
  // ListLemmas lists lemmas for selecting a lemma and then querying its jobs.
  rpc ListLemmas(ListLemmasRequest) returns (ListLemmasResponse);
}

message ListLemmasRequest {
  common.v1.PaginationRequest pagination = 1;
  // Optional fuzzy search on lemma surface / normalized form.
  string keyword = 2;
}

enum LemmaLevel {
  LEMMA_LEVEL_UNSPECIFIED = 0;
  LEMMA_LEVEL_A1 = 1;
  LEMMA_LEVEL_A2 = 2;
  LEMMA_LEVEL_B1 = 3;
  LEMMA_LEVEL_B2 = 4;
  LEMMA_LEVEL_C1 = 5;
  LEMMA_LEVEL_C2 = 6;
  LEMMA_LEVEL_OTHER = 99;
}

message LemmaItem {
  int64 id = 1;
  string surface = 2;
  string normalized = 3;
  LemmaLevel level = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListLemmasResponse {
  repeated LemmaItem lemmas = 1;
  common.v1.PaginationResponse pagination = 2;
}
