syntax = "proto3";

package pipeline.v1;

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/eslsoft/vocnet/pkg/api/pipeline/v1;pipelinev1";

// PipelineService provides query APIs for pipeline jobs/stages and lemmas.
service PipelineService {
  // ListJobs lists pipeline jobs with optional filters.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // ListJobStages lists all stages (tasks) under one job.
  rpc ListJobStages(ListJobStagesRequest) returns (ListJobStagesResponse);

  // ListLemmas lists lemmas for selecting a lemma and then querying its jobs.
  rpc ListLemmas(ListLemmasRequest) returns (ListLemmasResponse);
}

message ListJobsRequest {
  common.v1.PaginationRequest pagination = 1;
  // Optional filter: PENDING, RUNNING, PAUSED, COMPLETED, FAILED, CANCELLED.
  string status = 2;
  // Optional filter by lemma ID.
  int64 lemma_id = 3 [(validate.rules).int64.gte = 0];
}

message PipelineJob {
  int64 id = 1;
  string job_type = 2; // SINGLE_WORD, WORDBOOK
  string status = 3; // PENDING, RUNNING, PAUSED, COMPLETED, FAILED, CANCELLED
  string name = 4;
  string language = 5;
  int32 tier = 6;
  string term = 7;
  int32 total_terms = 8;
  int32 processed = 9;
  int32 skipped = 10;
  int32 failed = 11;
  string error_message = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp completed_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message ListJobsResponse {
  repeated PipelineJob jobs = 1;
  common.v1.PaginationResponse pagination = 2;
}

message ListJobStagesRequest {
  int64 job_id = 1 [(validate.rules).int64.gt = 0];
}

message PipelineStage {
  int64 id = 1;
  int64 job_id = 2;
  int64 lemma_id = 3;
  int32 phase = 4; // 1..5
  string phase_name = 5; // discovery, lexical, relational, intellectual, synthesis
  string status = 6; // PENDING, RUNNING, COMPLETED, FAILED, SKIPPED
  int32 attempts = 7;
  string error_message = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ListJobStagesResponse {
  repeated PipelineStage stages = 1;
}

message ListLemmasRequest {
  common.v1.PaginationRequest pagination = 1;
  // Optional fuzzy search on lemma surface / normalized form.
  string keyword = 2;
}

message LemmaItem {
  int64 id = 1;
  string surface = 2;
  string normalized = 3;
  string level = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListLemmasResponse {
  repeated LemmaItem lemmas = 1;
  common.v1.PaginationResponse pagination = 2;
}
