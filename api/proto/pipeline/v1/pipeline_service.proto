syntax = "proto3";

package pipeline.v1;

import "common/v1/types.proto";
import "pipeline/v1/pipeline.proto";
import "validate/validate.proto";

option go_package = "github.com/eslsoft/vocnet/pkg/api/pipeline/v1;pipelinev1";

// PipelineService provides pipeline job APIs.
service PipelineService {
  // SubmitJob submits a new pipeline run.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);

  // ActionJob performs generic control actions for a job.
  rpc ActionJob(ActionJobRequest) returns (ActionJobResponse);

  // ListJobs lists pipeline jobs with optional filters.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // ListJobStages lists all stages (tasks) under one job.
  rpc ListJobStages(ListJobStagesRequest) returns (ListJobStagesResponse);
}

message SubmitJobRequest {
  string term = 1 [(validate.rules).string.min_len = 1];
  string language = 2;
  int32 tier = 3;
  string name = 4;
}

message SubmitJobResponse {
  PipelineJob job = 1;
}

message ActionJobRequest {
  int64 job_id = 1 [(validate.rules).int64.gt = 0];
  PipelineActionType action = 2 [(validate.rules).enum.defined_only = true];
}

message ActionJobResponse {
  // For cancel action, this is the updated job.
  PipelineJob job = 1;
  // For retry action, this is the newly created job.
  PipelineJob new_job = 2;
}

message ListJobsRequest {
  common.v1.PaginationRequest pagination = 1;
  // Optional filter. UNSPECIFIED means no status filter.
  PipelineJobStatus status = 2;
  // Optional filter by lemma ID.
  int64 lemma_id = 3 [(validate.rules).int64.gte = 0];
}

message ListJobsResponse {
  repeated PipelineJob jobs = 1;
  common.v1.PaginationResponse pagination = 2;
}

message ListJobStagesRequest {
  int64 job_id = 1 [(validate.rules).int64.gt = 0];
}

message ListJobStagesResponse {
  repeated PipelineStage stages = 1;
}
