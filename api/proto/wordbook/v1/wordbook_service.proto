syntax = "proto3";

package wordbook.v1;

import "common/v1/types.proto";
import "google/protobuf/empty.proto";
import "validate/validate.proto";
import "wordbook/v1/wordbook.proto";

// CreateWordbookRequest creates a new wordbook.
message CreateWordbookRequest {
  common.v1.Language language = 1; // Primary language
  VisibilityType visibility = 2; // Visibility setting
  string name = 3; // Wordbook name, e.g., "IELTS Core Vocabulary"
  string description = 4; // Description of the wordbook
}

// UpdateWordbookRequest updates an existing wordbook.
message UpdateWordbookRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0];
  VisibilityType visibility = 2; // Visibility setting
  string name = 3; // Wordbook name, e.g., "IELTS Core Vocabulary"
  string description = 4; // Description of the wordbook
}

// AddWordsRequest adds terms to a wordbook.
message WordsActionRequest {
  int64 wordbook_id = 1 [(validate.rules).int64.gt = 0];
  repeated string terms = 2 [(validate.rules).repeated.min_items = 1];
}

// ListWordbooksRequest lists wordbooks with filtering and pagination.
message ListWordbooksRequest {
  common.v1.PaginationRequest pagination = 1;
  // Filter expression using CEL syntax
  // Supported fields: name, language, tags, visibility
  // Examples:
  //   name.contains("IELTS")
  //   language == LANGUAGE_ENGLISH
  //   "exam" in tags
  //   visibility == VISIBILITY_TYPE_PRIVATE
  string filter = 2;
  // Sorting: field name with optional direction
  // Supported fields: name, word_count, created_at, updated_at
  // Direction: asc or desc (default: asc)
  // Examples: "name", "word_count desc", "created_at desc"
  string order_by = 3;
}

// ListWordbooksResponse returns a list of wordbooks.
message ListWordbooksResponse {
  common.v1.PaginationResponse pagination = 1;
  repeated Wordbook wordbooks = 2;
}

// Wordbook management service for organizing user's vocabulary collections.
service WordbookService {
  // Wordbook CRUD operations
  rpc CreateWordbook(CreateWordbookRequest) returns (Wordbook) {}
  rpc UpdateWordbook(UpdateWordbookRequest) returns (Wordbook) {}
  rpc DeleteWordbook(common.v1.IDRequest) returns (google.protobuf.Empty) {}
  rpc GetWordbook(common.v1.IDRequest) returns (Wordbook) {}
  rpc ListWordbooks(ListWordbooksRequest) returns (ListWordbooksResponse) {}

  // Word management within wordbooks
  rpc AddWords(WordsActionRequest) returns (Wordbook) {}
  rpc RemoveWords(WordsActionRequest) returns (Wordbook) {}
}
