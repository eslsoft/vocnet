version: "2"

run:
  timeout: 10m

linters:
  enable:
    - bodyclose
    - dupl
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - unconvert
  settings:
    dupl:
      threshold: 100
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 30
  exclusions:
    rules:
      # Test files
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - gosec
          - gocognit
      # Mock files
      - path: internal/mocks/
        linters:
          - golint
          - unused
      # Generated API files
      - path: api/gen/
        linters:
          - all
      # Generated ent files
      - path: internal/infrastructure/database/ent/
        linters:
          - all
      # Scripts directory
      - path: scripts/
        linters:
          - all

