version: "2"

run:
  timeout: 10m

linters:
  enable:
    - bodyclose
    - dupl
    - gocognit
    - gocritic
    - gocyclo
    - misspell
    - unconvert
  settings:
    dupl:
      threshold: 100
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 30
  exclusions:
    generated: lax
    rules:
      # Test files
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - gosec
          - gocognit
      # Scripts directory
      - path: hack/
        linters:
          - gocritic
          - staticcheck
          - errcheck
